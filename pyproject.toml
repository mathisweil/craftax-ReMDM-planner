[project]
name = "craftax-remdm-planner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chex>=0.1.91",
    "craftax>=1.5.0",
    "distrax>=0.1.7",
    "flax>=0.12.6",
    "huggingface-hub>=1.9.1",
    "jax>=0.9.2",
    "matplotlib>=3.10.8",
    "numpy>=2.4.4",
    "optax>=0.2.8",
    "orbax>=0.1.9",
    "orjson>=3.11.8",
    "polars>=1.39.3",
    "pyyaml>=6.0.3",
    "wandb>=0.25.1",
]

[project.optional-dependencies]
cuda = ["jax[cuda13]>=0.9.2"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff==0.16.2",
]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["Craftax_Baselines"]

[tool.ruff.lint]
# Conservative explicit baseline; rule families are added one reviewed
# commit at a time (CLEANUP_PLAN.md). Disabled rules must be justified here.
select = ["F", "E4", "E7", "E9", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --durations=10"
