[project]
name = "craftax-remdm-planner"
version = "0.1.0"
description = "ReMDM Planner for Craftax"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chex>=0.1.91",
    "craftax>=1.5.0",
    "distrax>=0.1.7",
    "flax>=0.12.6",
    "huggingface-hub>=1.9.1",
    "jax>=0.9.2",
    "matplotlib>=3.10.8",
    "numpy>=2.4.4",
    "optax>=0.2.8",
    "orbax-checkpoint>=0.12",
    "orjson>=3.11.8",
    "polars>=1.39.3",
    "pyyaml>=6.0.3",
    "wandb>=0.25.1",
]

[project.optional-dependencies]
# No extra: CPU-only JAX (macOS, and Linux without a GPU).
# cuda13: driver >= 580, SM 7.5+. cuda12: fallback for driver >= 525, SM 5.2+.
# Both extras must exist: `conflicts` needs two, and a single extra collapses the lock.
cuda12 = ["jax[cuda12]>=0.9.2 ; sys_platform == 'linux'"]
cuda13 = ["jax[cuda13]>=0.9.2 ; sys_platform == 'linux'"]

[tool.uv]
package = false
conflicts = [[{ extra = "cuda12" }, { extra = "cuda13" }]]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff==0.16.2",
]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["Craftax_Baselines"]

[tool.ruff.lint]
# Conservative explicit baseline; rule families are added one reviewed
# commit at a time. Disabled rules must be justified here.
select = ["F", "E4", "E7", "E9", "I", "UP", "C4", "SIM", "RET", "B"]

[tool.ruff.lint.per-file-ignores]
# Path bootstrap must precede package imports in the standalone entry point.
"experiments/rl_finetuning/run_ablations.py" = ["E402"]

[tool.deptry]
known_first_party = ["src"]
extend_exclude = ["Craftax_Baselines"]
ignore_notebooks = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --durations=10"
