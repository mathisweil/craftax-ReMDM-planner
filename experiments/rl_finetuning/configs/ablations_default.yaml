# =============================================================================
# ReMDM RL Fine-Tuning Ablation Suite — Default Configuration
# This file is self-contained and does NOT require defaults.yaml to be loaded.
# All keys are loaded and converted to UPPERCASE by run_ablations.py.
# =============================================================================

# ── Environment ───────────────────────────────────────────────────────────────
env_name: "Craftax-Classic-Symbolic-v1"
use_optimistic_resets: false
optimistic_reset_ratio: 16

# ── Transformer architecture (must match pretrained checkpoint) ───────────────
d_model: 256
n_heads: 4
n_layers: 4
d_ff: 512
obs_encoder_layers: 2
obs_encoder_width: 512
dropout_rate: 0.1

# ── Diffusion ─────────────────────────────────────────────────────────────────
plan_horizon: 40
diffusion_schedule: "cosine"
train_sigma: 0.0
label_smoothing: 0.0

# ── Reverse sampling (eval) ───────────────────────────────────────────────────
val_diffusion_steps: 50
remask_strategy: "rescale"
eta: 0.5
use_loop: true
t_on: 0.7
t_off: 0.3
temperature: 0.5
top_p: 0.95

# ── Training loop ─────────────────────────────────────────────────────────────
max_iter: 500                  # training iterations per ablation
num_envs: 64                  # parallel environments for rollouts
num_steps: 128                # PPO steps per rollout
batch_size: 512               # gradient batch size
lr: 3.0e-4
weight_decay: 1.0e-4          # AdamW weight decay
max_grad_norm: 1.0
collect_temperature: 1.0             # PPO sampling temperature during collection
ema_decay: 0.999              # EMA decay for eval model weights

# ── Evaluation ────────────────────────────────────────────────────────────────
eval_every: 25                # evaluate every N iterations
eval_steps: 512               # env steps per eval rollout
eval_replan: 8                # env steps per diffusion plan during eval

# ── PPO collector ─────────────────────────────────────────────────────────────
ppo_model_type: "ppo_rnn"
layer_size: 512

# ── Diagnostic frequencies ────────────────────────────────────────────────────
grad_align_every: 25          # gradient alignment check frequency
repr_drift_every: 25          # representation drift frequency
t_analysis_every: 25          # timestep analysis frequency
cka_every: 50                 # CKA computation frequency (expensive)
per_layer_every: 25           # per-layer gradient norm frequency
t_analysis_n_bins: 10         # number of t-bins for timestep analysis
cka_batch_size: 64            # batch size for CKA computation

# ── Return / advantage weighting ─────────────────────────────────────────────
win_threshold: 0.5            # minimum return to be counted as a "win"
return_weight_floor: 0.1      # clip floor for return weights
return_weight_cap: 5.0        # clip ceiling for return weights

# ── Group A: Regularisation / Constraint Methods ─────────────────────────────
# EWC (Elastic Weight Consolidation). Range: [0, inf). 0 disables EWC.
ewc_lambda: 100.0

# EWC Fisher estimation: number of batches to average over
ewc_fisher_batches: 20

# LLRD (Layer-wise Learning Rate Decay). decay^depth applied per transformer block.
# Range: (0, 1]. 1.0 = uniform LR. Typical: 0.8-0.95.
llrd_decay: 0.9

# LoRA rank and alpha. Effective update = (alpha/rank) * B @ A.
lora_rank: 8
lora_alpha: 16.0

# Mixed replay offline ratio: fraction of each batch drawn from the offline buffer.
# Range: [0, 1). 0 = no offline data. Typical: 0.25-0.5.
mixed_replay_ratio: 0.25

# Mixed replay buffer size (number of offline windows to store).
mixed_replay_buffer_size: 10000

# Trust region KL threshold (hard constraint). If KL > threshold, large penalty.
trust_region_kl: 0.05

# Soft KL penalty coefficient (for kl_penalty ablation).
kl_coef: 0.1

# ── Group B: Training Signal Modifications ────────────────────────────────────
# t-Curriculum: anneal t range from [t_curriculum_start, 1.0] to [eps, t_curriculum_end].
t_curriculum_start: 0.8       # initial t_min for curriculum (high-t only)
t_curriculum_end: 0.2         # final t_max for curriculum (targets low-t)
t_curriculum_steps: 200       # number of iterations over which to anneal

# Low-t only upper bound for t range.
t_max_low: 0.2

# Entropy bonus coefficient. Range: [0, inf). 0 disables entropy bonus.
entropy_coef: 0.01

# Gradient surgery (PCGrad): project conflicting RL gradients.
# Implemented as a training loop flag; no hyperparameter needed.

# Advantage clipping (PPO-style): clip ratios to [1-eps, 1+eps].
adv_clip_eps: 0.2

# ── Group C: Architecture / Parameter Isolation ───────────────────────────────
# Layer ablation: how many top transformer layers to unfreeze.
layer_ablation_top_n: 1       # used for layer_ablation_top1; overridden per spec

# ── Group D: Reward / Data Quality ───────────────────────────────────────────
# Reward filtering: only train on windows with return > percentile.
reward_filter_percentile: 75

# Running statistics EMA decay for return normalisation.
running_stats_ema_decay: 0.99

# Reward model MLP width and depth (for reward_model_weighting ablation).
reward_model_width: 64
reward_model_depth: 2
reward_model_lr: 1.0e-3
reward_model_train_steps: 50  # steps to train reward model per iteration

# ── Output / Logging ──────────────────────────────────────────────────────────
use_wandb: false
wandb_project: craftax-ReMDM-planner-ablations
wandb_entity: myopic-planner
save_checkpoints: false       # save final params for each ablation

# ── Multi-seed ────────────────────────────────────────────────────────────────
num_seeds: 1                  # run each ablation num_seeds times, report mean±std
