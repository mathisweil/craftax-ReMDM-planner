# =============================================================================
# RL Fine-Tuning Ablation Suite — Full Craftax, UCL hardware
# Matches checkpoint produced by: configs/final_craftax_full_ucl.yaml
#   (d_model=384, n_heads=8, n_layers=6, d_ff=768, plan_horizon=32, seed 42)
# Target hardware: UCL RTX 3090 Ti (24 GB VRAM)
# Holds only its deltas: every other key is inherited from
# ablations_default.yaml, which is layered on automatically.
# =============================================================================

# ── Environment ───────────────────────────────────────────────────────────────
env_name: "Craftax-Symbolic-v1"

# ── Transformer architecture (must match pretrained checkpoint) ───────────────
d_model: 384
n_heads: 8
n_layers: 6
d_ff: 768
obs_encoder_width: 768

# ── Diffusion (must match pretrained checkpoint) ─────────────────────────────
plan_horizon: 32

# ── Reverse sampling (eval) ──────────────────────────────────────────────────
val_diffusion_steps: 25
temperature: 0.3

# ── Training loop (24 GB VRAM — obs_dim=8268, ~6x Classic memory per env) ────
num_envs: 128                 # 2x default (conservative: obs is 6x larger)
batch_size: 1024              # 2x default

# ── Evaluation ────────────────────────────────────────────────────────────────
eval_steps: 1024              # longer eval for less noisy metrics

# ── Diagnostic frequencies ────────────────────────────────────────────────────
cka_batch_size: 128

# ── Output / Logging ──────────────────────────────────────────────────────────
use_wandb: true

# ── Multi-seed ────────────────────────────────────────────────────────────────
num_seeds: 3
