# =============================================================================
# ReMDM default configuration
# All values can be overridden via CLI args (e.g. --lr 1e-4).
# =============================================================================

# ── Environment ──────────────────────────────────────────────────────────────
env_name: "Craftax-Symbolic-v1"

# ── Diffusion model ───────────────────────────────────────────────────────────
plan_horizon: 32          # Length of the action plan H
diffusion_steps: 50       # Number of denoising steps T at inference
diffusion_schedule: "cosine"   # Noise schedule: cosine | linear
remask_strategy: "rescale"     # Remasking strategy: rescale | cap | conf | loop
eta: 0.5                  # Remasking strength
t_on: 0.7                 # Loop strategy: upper time bound for remasking window
t_off: 0.3                # Loop strategy: lower time bound for remasking window

# ── Transformer architecture ─────────────────────────────────────────────────
d_model: 256              # Transformer hidden dimension
n_heads: 4                # Number of attention heads
n_layers: 4               # Number of transformer blocks
d_ff: 512                 # FFN inner dimension
obs_encoder_layers: 2     # Number of MLP layers in the observation encoder
obs_encoder_width: 512    # Width of observation encoder hidden layers
dropout_rate: 0.1         # Dropout rate (disabled at inference via deterministic=True)

# ── Optimisation ─────────────────────────────────────────────────────────────
lr: 3.0e-4                # Adam learning rate
max_grad_norm: 1.0        # Gradient clipping norm
batch_size: 256           # Minibatch size for offline training

# ── Offline training ─────────────────────────────────────────────────────────
offline_data_path: "trajectories.npz"   # Path to .npz file produced by --mode collect
num_train_steps: 100000   # Number of gradient steps for offline training

# ── Online training ──────────────────────────────────────────────────────────
num_envs: 32              # Number of parallel environments
num_steps: 128            # Environment steps per update (must be divisible by replan_every)
num_updates: 1000         # Number of outer update iterations
replan_every: 8           # Steps to execute from a plan before replanning (≤ plan_horizon)
update_epochs: 1          # Gradient passes over each collected batch
num_minibatches: 4        # Number of minibatches per epoch
offline_checkpoint_path: null  # Optional: offline checkpoint to warm-start online training
use_optimistic_resets: false   # Use OptimisticResetVecEnvWrapper instead of AutoReset+Batch
optimistic_reset_ratio: 16     # Reset ratio for optimistic resets (num_envs / ratio = num_resets)

# ── Inference / evaluation ───────────────────────────────────────────────────
checkpoint_path: null     # Path to trained checkpoint (required for --mode inference)
eval_steps: 1000          # Number of environment steps to run during evaluation

# ── Data collection & agent-based offline training ────────────────────────────
# Used by both --mode collect (save to disk) and --mode offline (live from agent).
# Train a PPO agent first with ppo_rnn.py or ppo_rnd.py, then point here.
ppo_checkpoint_path: null      # Path to a pre-trained ActorCritic PPO checkpoint
collect_num_steps: 1000000     # Total env steps to collect (--mode collect)
collect_num_envs: 64           # Parallel environments during collection
layer_size: 512                # Hidden layer width of the ActorCritic network

# ── Logging / W&B ────────────────────────────────────────────────────────────
use_wandb: true
debug: true
wandb_project: "remdm-craftax"
wandb_entity: ""
save_policy: false        # Save the model checkpoint at the end of training
num_repeats: 1            # Number of independent training runs (vmapped)
seed: null                # RNG seed (null → random)
jit: true                 # Disable with --no-jit for easier debugging
