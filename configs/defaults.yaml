# =============================================================================
# ReMDM default configuration — the final Craftax Classic recipe
# Override any value via CLI: python main.py --mode offline --lr 1e-4
# -----------------------------------------------------------------------------
# This file IS the paper's Classic DAgger recipe, not a neutral baseline: run
# main.py with no --config and you get it. The per-cluster configs
# (final_classic_{qmul,ucl}.yaml) hold only what genuinely differs between the
# two machines, which is num_envs and seed.
#
# Two consequences worth knowing before editing:
#
#   * Presets that predate this recipe pin the values they used to inherit,
#     under a "Baseline pins" heading. Those pins are load-bearing.
#   * Fairness-critical schedule keys (budgets, warmup, beta target, buffer
#     retention, validation cadence) are denominated in env frames or update
#     cycles and rescaled to the actual rollout width at load time by
#     resolve_num_updates / resolve_scaled_hyperparams.
#
# Derived quantities quoted below come from resolve_num_updates and
# resolve_scaled_hyperparams, not from arithmetic done by hand, and are
# asserted by test_final_configs_resolve_to_their_documented_quantities.
#
# Warmup units (author decision 2026-08-15, final): lr_warmup_frames is
# env-frame denominated and converts to the gradient-step count optax
# consumes via (frames // fpu) * update_epochs * num_minibatches
# (* dagger_train_passes online).
# =============================================================================

# ── Environment ──────────────────────────────────────────────────────────────
env_name: "Craftax-Classic-Symbolic-v1"
use_optimistic_resets: false
optimistic_reset_ratio: 16

# ── Transformer architecture ─────────────────────────────────────────────────
# 9M parameters. Matches every released DAgger checkpoint, so --mode inference
# against one needs no architecture override.
d_model: 384
n_heads: 8
n_layers: 6
d_ff: 768
obs_encoder_layers: 2
obs_encoder_width: 768
dropout_rate: 0.1

# ── Diffusion ────────────────────────────────────────────────────────────────
plan_horizon: 32
diffusion_schedule: "cosine"        # cosine | linear
train_sigma: 0.0                    # remasking correction during training (0 = standard MDLM)
label_smoothing: 0.0                # cross-entropy label smoothing (0 = exact ELBO)

# ── Reverse sampling (training, validation, inference) ──────────────────────
diffusion_steps: 15                 # denoising steps T during training
diffusion_steps_eval: 10            # denoising steps T at inference (--mode inference)
remask_strategy: "rescale"          # rescale | cap | conf
eta: 0.5                            # remasking strength
use_loop: true                      # three-phase loop (Algorithm 3)
t_on: 0.7
t_off: 0.3
temperature: 0.5
top_p: 0.95

# ── Optimisation ─────────────────────────────────────────────────────────────
lr: 3.0e-4
max_grad_norm: 1.0
# lr_warmup_frames is the env-frame-denominated warmup budget (invariant
# under num_envs changes), converted to the gradient-step count optax
# consumes via:
#   LR_WARMUP_STEPS = (lr_warmup_frames // fpu) * update_epochs
#                     * num_minibatches (* dagger_train_passes online)
# Canonical value 1,638,400 frames (author decision 2026-08-15: the
# corrected effective warmup; the earlier nominal 1.048576e8 exceeded the
# whole budget). Resolves to 8512 gradient steps on QMUL's 96 envs, 1600
# on UCL's 512. Set to 0 to disable warmup.
lr_warmup_frames: 1.6384e6          # env-frame warmup budget

# ── Rollout (shared by offline + online) ─────────────────────────────────────
num_envs: 1024                      # overridden per cluster: 96 QMUL, 512 UCL
num_steps: 128
num_minibatches: 8
update_epochs: 8
num_repeats: 1                      # independent training seeds (vmapped)

# ── Offline training (--mode offline) ────────────────────────────────────────
# num_updates is derived as offline_total_timesteps // (num_envs * num_steps),
# so the env-frame budget is hardware-portable across num_envs changes.
offline_total_timesteps: 1.0e+8     # env-frame budget
collect_temperature: 1.0            # softmax temperature on PPO logits during data collection
return_weight_cap: 5.0              # clip ceiling for per-window return weights

# ── Online DAgger training (--mode online) ───────────────────────────────────
# num_updates is derived as online_total_timesteps // (num_envs * num_steps).
online_total_timesteps: 1.0e+8      # env-frame budget
dagger_beta_init: 1.0               # initial expert mixing probability beta_1
# dagger_beta_final is the env-frame-invariant target mixing ratio at the
# end of training; the per-update decay is derived via:
#   decay = (beta_final / beta_init) ** (1 / num_updates)
# Resolves to decay 0.9998689 over QMUL's 8138 updates, 0.9993005 over UCL's 1525.
dagger_beta_final: 0.344            # target final beta
# dagger_buffer_cycles measures buffer capacity in *update cycles of history*
# (1 cycle = num_envs * num_steps frames), invariant under num_envs:
#   buffer_max = round(cycles * fpu)
# Cycle-denominated by author decision (2026-08-15): retention stays
# hardware-invariant. Resolves to 23,438 samples on QMUL, 125,000 on UCL.
dagger_buffer_cycles: 1.90735       # buffer capacity in update cycles
# B1: passes per update over the aggregated buffer.  Each pass redraws a
# fresh sample of size samples_per_update from D, so total samples seen
# per update ≈ n_passes * samples_per_update.  null = 1 pass, which
# matches offline BC's per-update gradient work exactly (fair compute
# comparison: same num_updates * update_epochs * num_minibatches grad
# steps).  Raise to >1 to trade BC fairness for higher per-update D
# coverage (e.g. ~⌊|D|/samples_per_update⌋ for full-buffer coverage).
dagger_train_passes: null
# B2: deterministic argmax expert (true) vs categorical sampling (false).
# True keeps the expert mapping s -> a* fixed, removing label noise from D.
dagger_expert_deterministic: true

# ── Validation rollouts ──────────────────────────────────────────────────────
# val_interval_frames is the env-frame-invariant validation cadence; the
# update-step interval is derived via:  VAL_INTERVAL = val_interval_frames // fpu
val_interval_frames: 1.0e+6         # env-frames between validations
val_diffusion_steps: 50             # denoising steps during validation
val_replan_every: 4                 # env steps executed per diffusion plan
val_steps: 256                      # total env steps per validation rollout

# ── Data collection (--mode collect) ─────────────────────────────────────────
collect_num_steps: 10000000
collect_num_envs: 128
ppo_model_type: "ppo_rnn"           # ppo | ppo_rnn | ppo_rnd
layer_size: 512

# ── Inference (--mode inference) ─────────────────────────────────────────────
eval_steps: 10000
eval_num_envs: 32

# ── Checkpointing ────────────────────────────────────────────────────────────
save_policy: true

# ── Resume ───────────────────────────────────────────────────────────────────
resume_checkpoint_path: null        # accepts wandb: refs
resume_wandb_run_id: null           # auto-read from checkpoint metadata if null
resume_step: null                   # auto-read from checkpoint metadata if null

# ── XLA ──────────────────────────────────────────────────────────────────────
# Persistent compilation cache.  Compiling the online DAgger graph costs ~52 s
# on a 4070 Ti, and every separately-launched seed and every ablation entry
# pays it again.  The cache key is the HLO, so this changes no numerics.
# Point it at LOCAL disk: on an NFS home the cache costs more than the compile
# it replaces.  null = disabled (JAX's own default).
jax_compilation_cache_dir: null

# ── Logging ──────────────────────────────────────────────────────────────────
seed: null                          # random if not set
use_wandb: true
wandb_project: craftax-ReMDM-planner
wandb_entity: myopic-planner
wandb_download_dir: null            # null = wandb default ./artifacts/
