# =============================================================================
# Smoke test overrides — fast end-to-end sanity check on CPU (--mode smoke).
#
# Overlaid on configs/defaults.yaml by main.build_config; only the keys that
# need shrinking appear here.
#
# Sizing notes.  make_train_dagger asserts four invariants that are DERIVED
# from these values, so they cannot be tuned independently:
#
#   1. num_steps % plan_horizon == 0   and   num_steps >= plan_horizon
#   2. samples_per_update = num_envs * (num_steps - plan_horizon + 1)
#      must be divisible by num_minibatches
#   3. samples_per_update <= dagger_buffer_max
#   4. num_updates = online_total_timesteps // (num_envs * num_steps)
#
# With the values below: n_cycles = 1, samples_per_update = 8,
# num_updates = 6.  Shrinking online_total_timesteps alone would NOT shrink
# the run, because the per-update cost is set by plan_horizon, diffusion_steps
# and the validation rollout, not by the frame budget.
# =============================================================================

# ── Rollout ──────────────────────────────────────────────────────────────────
num_envs: 8
num_steps: 8                        # == plan_horizon -> n_cycles = 1
num_minibatches: 2                  # divides samples_per_update (8)
update_epochs: 1

# ── Budget ───────────────────────────────────────────────────────────────────
online_total_timesteps: 384         # // (8 * 8) -> 6 updates

# ── Transformer architecture ─────────────────────────────────────────────────
d_model: 32
n_heads: 2
n_layers: 1
d_ff: 32
obs_encoder_layers: 1
obs_encoder_width: 32

# ── Diffusion ────────────────────────────────────────────────────────────────
plan_horizon: 8
diffusion_steps: 2
use_loop: false                     # single-phase sampler: one scan to compile

# ── Validation ───────────────────────────────────────────────────────────────
val_interval_frames: 192            # // (8 * 8 fpu) -> every 3 updates
val_diffusion_steps: 2
val_replan_every: 1
val_steps: 2                        # // val_replan_every -> 2 cycles

# ── DAgger ───────────────────────────────────────────────────────────────────
dagger_buffer_cycles: 1.0           # x 64 fpu = 64 samples >= samples_per_update (8)
dagger_beta_final: 0.7350918906249999  # = 0.95^6: the historical 0.95/update decay over 6 updates
dagger_train_passes: 1

# ── Optimisation ─────────────────────────────────────────────────────────────
lr_warmup_frames: 0                 # warmup disabled

# ── Expert ───────────────────────────────────────────────────────────────────
# Left unset so run_smoke generates a randomly initialised expert and the mode
# runs on a clean clone with no downloads. Pass --ppo-checkpoint to use a
# trained expert instead. Note the released PPO checkpoints were saved on GPU
# and currently fail to restore on a CPU-only machine.
ppo_checkpoint_path: null

# ── Logging / checkpointing ──────────────────────────────────────────────────
seed: 0
use_wandb: false
save_policy: false
