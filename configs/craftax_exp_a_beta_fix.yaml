# =============================================================================
# Experiment A-Full — Beta fix only on Full Craftax
# Target hardware: NVIDIA RTX 4090 (24 GB)
# Same as exp_a_beta_fix.yaml but on Craftax-Symbolic-v1 (obs_dim 8268, 43
# actions). num_envs and dagger_buffer_max are dropped to fit the larger obs.
# =============================================================================

# ── Environment ──────────────────────────────────────────────────────────────
env_name: "Craftax-Symbolic-v1"

# ── Optimisation ─────────────────────────────────────────────────────────────
lr_warmup_frames: 786432            # 3 updates x 64 grad steps = 192 (was lr_warmup_steps: 200)

# ── Rollout ──────────────────────────────────────────────────────────────────
num_envs: 2048                      # halved from 4096: larger obs per env

# ── Online DAgger training ───────────────────────────────────────────────────
online_total_timesteps: 524288000   # 2000 updates x 262,144 fpu; harder task, more room to learn
dagger_beta_final: 0.2464761046379074  # = 0.9993^2000
dagger_buffer_cycles: 0.762939453125  # x 262,144 fpu = 200,000 samples (8268 obs -> ~6.6 GB)

# ── Validation rollouts ──────────────────────────────────────────────────────
val_interval_frames: 7864320        # 30 updates x 262,144 fpu

# ── Logging ──────────────────────────────────────────────────────────────────
seed: 42

# ── Baseline pins ────────────────────────────────────────────────────────────
# defaults.yaml holds the final Classic recipe, not a neutral baseline. This
# experiment predates that recipe and is defined against the original
# baseline, so it pins the values it used to inherit. They are load-bearing:
# removing them silently redefines this experiment.

d_model: 256
n_heads: 4
n_layers: 4
d_ff: 512
obs_encoder_width: 512
