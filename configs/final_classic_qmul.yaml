# =============================================================================
# Classic DAgger - QMUL H200 (8 GB VRAM budget) - second seed
# Env-frame-matched fairness with final_classic_ucl.yaml (Exp B, seed 42).
# -----------------------------------------------------------------------------
# FAIRNESS PRINCIPLE: same total env frames in both offline BC and online DAgger.
# QMUL has 32x fewer parallel envs (128 vs 4096), so it does 32x more update
# steps to see the same total data. Beta schedule, LR warmup, and validation
# cadence all scale by 32 so they align in env-frame time.
#
# DERIVED VALUES (scale = 4096/128 = 32, exact integer):
#   num_envs:             4096 -> 128    (was 384/1536; both OOM. minibatch now 1552)
#   offline_num_updates:  572  -> 18304  (299,892,736 env frames, EXACT match)
#   num_updates (online): 1500 -> 48000  (786,432,000 env frames, EXACT match)
#   dagger_beta_decay:    0.9993 -> 0.999978   (final beta = 0.350 in both, after 1500 / 48000 updates)
#   lr_warmup_steps:      200  -> 6400   (same env-frame warmup duration: 200 * 32)
#   val_interval:         100  -> 3200   (same number of validations: ~5.72)
#
# OOM HISTORY: num_envs=1536 OOMed at 20 GB single allocation (minibatch=18624).
# num_envs=384 OOMed at 15 GB single allocation (minibatch=4656). At minibatch
# size B, the dominant memory is ~B * 320k floats * 4 bytes (transformer
# activations stored for backward) plus ~equal-size workspace during backward,
# so total scales linearly with minibatch. minibatch=1552 -> ~2 GB stored
# activations, ~4 GB peak. Comfortable in 8 GB with margin for params,
# optimizer state, env state, and dagger buffer.
#
# BUFFER DEVIATION (env-frame matching not feasible at 8 GB):
#   dagger_buffer_max:    1000000 -> 31250 (cycle-matched in update-time: 1.91 updates of history)
#   Env-frame match would require 1M samples (~5 GB extra VRAM, doesn't fit).
#   Both seeds therefore see "1.91 updates of recent history" in the buffer:
#   equivalent in update-time, not in env-frame time.
#
# IDENTICAL TO UCL: architecture, all diffusion params, batch_size, lr,
# max_grad_norm, num_minibatches=8, update_epochs=8, dagger_beta_init,
# replan_every, val_replan_every, val_steps, all eval/inference settings.
#
# UNAVOIDABLE DEVIATION: per-step minibatch is 1552 (vs UCL 49664, 32x smaller)
# due to lower num_envs. Same total samples processed across training; SGD
# gradient noise is higher per step. lr is unchanged.
#
# Wall-clock: 32x more update steps but each step processes 32x less data,
# so per-step wall-time is much smaller (smaller minibatches under-utilize
# the GPU). Net slowdown vs UCL is hard to predict but typically 3-10x rather
# than 32x for transformer training at this scale.
# =============================================================================

# -- Environment --------------------------------------------------------------
env_name: "Craftax-Classic-Symbolic-v1"
use_optimistic_resets: false
optimistic_reset_ratio: 16

# -- Transformer architecture (IDENTICAL to first seed) ----------------------
d_model: 384
n_heads: 8
n_layers: 6
d_ff: 768
obs_encoder_layers: 2
obs_encoder_width: 768
dropout_rate: 0.1

# -- Diffusion (IDENTICAL) ----------------------------------------------------
plan_horizon: 32
diffusion_schedule: "cosine"
train_sigma: 0.0
label_smoothing: 0.0

# -- Reverse sampling (IDENTICAL) --------------------------------------------
diffusion_steps: 15
remask_strategy: "rescale"
eta: 0.5
use_loop: true
t_on: 0.7
t_off: 0.3
temperature: 0.5
top_p: 0.95

# -- Optimisation (IDENTICAL) ------------------------------------------------
lr: 3.0e-4
max_grad_norm: 1.0
batch_size: 1024

# -- Offline training (SCALED to match UCL env frames EXACTLY) ---------------
offline_num_updates: 18304          # SCALED: 572 * 32; 299,892,736 env frames (exact UCL match)
num_envs: 128                       # OOM-safe (was 384/1536); minibatch 128*97/8 = 1552
num_steps: 128
num_minibatches: 8                  # IDENTICAL to UCL (preserves SGD structure)
update_epochs: 8
num_repeats: 1
collect_temperature: 1.0
lr_warmup_steps: 6400               # SCALED: 200 * 32
return_weight_cap: 5.0
val_interval: 3200                  # SCALED: 100 * 32 (same number of validations)
val_diffusion_steps: 50
val_replan_every: 4
val_steps: 256

# -- Online DAgger training (SCALED to match UCL env frames + beta schedule) -
num_updates: 48000                  # SCALED: 1500 * 32; 786,432,000 env frames (exact UCL match)
replan_every: 4
dagger_beta_init: 1.0
dagger_beta_decay: 0.999978         # SCALED: 0.9993^(1/32); final beta=0.350 matches UCL
dagger_buffer_max: 31250            # cycle-matched in update-time (1.91 updates of history)

# -- Data collection ---------------------------------------------------------
collect_num_steps: 10000000
collect_num_envs: 128
ppo_model_type: "ppo_rnn"
layer_size: 512

# -- Inference ----------------------------------------------------------------
eval_steps: 10000
eval_num_envs: 32
diffusion_steps_eval: 10

# -- Checkpointing -----------------------------------------------------------
checkpoint_dir: "checkpoints_exp_b_seed43_qmul"
save_policy: true

# -- Resume -------------------------------------------------------------------
resume_checkpoint_path: null
resume_wandb_run_id: null
resume_step: null

# -- Logging ------------------------------------------------------------------
seed: 43                            # CHANGED: 42 -> 43 (different seed)
use_wandb: true
wandb_project: "remdm-craftax"
wandb_entity: "mathis-weil-university-college-london-ucl-"
