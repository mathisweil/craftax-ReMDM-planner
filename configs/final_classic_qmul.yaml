# =============================================================================
# Final Craftax Classic DAgger — QMUL H200 8 GB partition (seed 43) - EXP B - 9M model
# Env-frame-matched second seed of final_classic_ucl.yaml.
# -----------------------------------------------------------------------------
# The recipe itself lives in configs/defaults.yaml. Only what differs between
# the two clusters lives here, which is the rollout width and the seed.
#
# Nothing enforces that this file and final_classic_ucl.yaml stay in step: the
# guard is test_ucl_and_qmul_siblings_differ_only_in_num_envs_and_seed. A
# hyperparameter change meant for both belongs in defaults.yaml, not here.
#
# All fairness-critical hyperparameters are denominated in env frames or update
# cycles, so resolve_scaled_hyperparams() rescales them to this rollout width
# automatically. Resolves to num_updates = 8138, lr_warmup_steps = 8533,
# dagger_buffer_max = 23,438, beta decay 0.9998689.
# =============================================================================

# ── Rollout ──────────────────────────────────────────────────────────────────
num_envs: 96                        # VRAM-tuned to ~6.5–7.5 GB; minibatch = 96*128/8 = 1536

# ── Logging ──────────────────────────────────────────────────────────────────
seed: 43
