# =============================================================================
# Final Craftax Classic DAgger — QMUL H200 8 GB partition (seed 43) - EXP B - 9M model
# Env-frame-matched second seed of final_classic_ucl.yaml.
# -----------------------------------------------------------------------------
# This file is the shared base for the pair: `final_classic_ucl.yaml` extends
# it and restates only num_envs (512 vs 96 here) and seed (42 vs 43 here), so
# the two clusters cannot drift apart on any other hyperparameter.
#
# It carries only its deltas against configs/defaults.yaml.  All
# fairness-critical hyperparameters are denominated in env frames or update
# cycles, so they are AUTOMATICALLY scaled to this hardware tier by
# resolve_scaled_hyperparams() — no manual derivation.
# =============================================================================

# ── Transformer architecture ─────────────────────────────────────────────────
d_model: 384
n_heads: 8
n_layers: 6
d_ff: 768
obs_encoder_width: 768

# ── Optimisation ─────────────────────────────────────────────────────────────
lr_warmup_frames: 1.048576e8        # IDENTICAL to UCL; resolves to 8533 update steps on 96 envs

# ── Rollout ──────────────────────────────────────────────────────────────────
num_envs: 96                        # VRAM-tuned to ~6.5–7.5 GB; minibatch = 96*128/8 = 1536
num_steps: 128
update_epochs: 8

# ── Online DAgger training ───────────────────────────────────────────────────
online_total_timesteps: 1.0e+8
dagger_beta_final: 0.344
dagger_buffer_cycles: 1.90735

# ── Validation rollouts ──────────────────────────────────────────────────────
val_interval_frames: 1.0e+6
val_steps: 256

# ── Logging ──────────────────────────────────────────────────────────────────
seed: 43
