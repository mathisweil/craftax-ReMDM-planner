# =============================================================================
# Classic DAgger — QMUL H200 (8 GB VRAM budget) — second seed
# Maximum-fidelity match to final_classic_ucl.yaml (Exp B, seed 42).
# -----------------------------------------------------------------------------
# CHANGES vs final_classic_ucl.yaml (only what 8 GB forces, plus seed):
#   num_envs:            4096 -> 1536     (largest that fits in 8 GB)
#   dagger_buffer_max:   1000000 -> 375000 (cycle-matched: 1.91 updates of history,
#                                          identical to UCL's 1M / (4096*128) ratio)
#   seed:                42 -> 43         (independent seed)
#   checkpoint_dir:      separate
# EVERYTHING ELSE is bit-identical to UCL: num_minibatches=8, update_epochs=8,
# num_updates=1500, lr=3e-4, lr_warmup_steps=200, dagger_beta_decay=0.9993,
# all architecture, all diffusion, all eval. Same SGD structure (8*8=64 grad
# steps per update), same beta schedule, same buffer replay-cycle period.
# The only unavoidable deviation is the per-step minibatch (24576 vs UCL 65536,
# ~2.7x smaller) — this is purely a function of the VRAM ceiling.
# Estimated VRAM: ~7.1 GB
# =============================================================================

# ── Environment ──────────────────────────────────────────────────────────────
env_name: "Craftax-Classic-Symbolic-v1"
use_optimistic_resets: false
optimistic_reset_ratio: 16

# ── Transformer architecture (IDENTICAL to first seed) ──────────────────────
d_model: 384
n_heads: 8
n_layers: 6
d_ff: 768
obs_encoder_layers: 2
obs_encoder_width: 768
dropout_rate: 0.1

# ── Diffusion (IDENTICAL) ────────────────────────────────────────────────────
plan_horizon: 32
diffusion_schedule: "cosine"
train_sigma: 0.0
label_smoothing: 0.0

# ── Reverse sampling (IDENTICAL) ────────────────────────────────────────────
diffusion_steps: 15
remask_strategy: "rescale"
eta: 0.5
use_loop: true
t_on: 0.7
t_off: 0.3
temperature: 0.5
top_p: 0.95

# ── Optimisation (IDENTICAL) ────────────────────────────────────────────────
lr: 3.0e-4
max_grad_norm: 1.0
batch_size: 1024

# ── Offline training (CHANGED: num_envs only) ───────────────────────────────
total_timesteps: 3.0e+8
num_envs: 1536
num_steps: 128
num_minibatches: 8
update_epochs: 8
num_repeats: 1
collect_temperature: 1.0
lr_warmup_steps: 200
return_weight_cap: 5.0
val_interval: 100
val_diffusion_steps: 50
val_replan_every: 4
val_steps: 256

# ── Online DAgger training (CHANGED: buffer only; beta + updates IDENTICAL) ─
num_updates: 1500                   # IDENTICAL to UCL
replan_every: 4
dagger_beta_init: 1.0
dagger_beta_decay: 0.9993           # IDENTICAL — schedule must match for fairness
dagger_buffer_max: 375000           # CHANGED: 1000000 -> 375000 (cycle-matched)

# ── Data collection ─────────────────────────────────────────────────────────
collect_num_steps: 10000000
collect_num_envs: 128
ppo_model_type: "ppo_rnn"
layer_size: 512

# ── Inference ────────────────────────────────────────────────────────────────
eval_steps: 10000
eval_num_envs: 32
diffusion_steps_eval: 10

# ── Checkpointing ───────────────────────────────────────────────────────────
checkpoint_dir: "checkpoints_exp_b_seed43_qmul"
save_policy: true

# ── Resume ───────────────────────────────────────────────────────────────────
resume_checkpoint_path: null
resume_wandb_run_id: null
resume_step: null

# ── Logging ──────────────────────────────────────────────────────────────────
seed: 43                            # CHANGED: 42 -> 43 (different seed)
use_wandb: true
wandb_project: "remdm-craftax"
wandb_entity: "mathis-weil-university-college-london-ucl-"
