# =============================================================================
# Final Craftax Classic DAgger — QMUL H200 8 GB partition (seed 43)
# Env-frame-matched second seed of final_classic_ucl.yaml.
# -----------------------------------------------------------------------------
# Hardware ratio is fixed: qmul_fpu/ucl_fpu = (96*128)/(4096*128) = 3/128.
# Because this ratio is independent of the total env-frame budget, every
# fairness-critical key below is INVARIANT under offline_total_timesteps and
# online_total_timesteps changes — as long as UCL and QMUL share the same
# totals, fairness holds automatically.
#
# Scaling formulas for keys denominated in update steps (not env frames):
#   dagger_beta_decay : ucl_decay^(qmul_fpu/ucl_fpu)
#                     = 0.9993^(3/128) = 0.99998359
#   lr_warmup_steps   : ucl_warmup * (ucl_fpu/qmul_fpu)
#                     = 200 * 128/3   = 8533
#   val_interval      : ucl_val_interval * (ucl_fpu/qmul_fpu)
#                     = 4 * 128/3     = 171
#   dagger_buffer_max : ucl_buffer * (qmul_envs/ucl_envs)
#                     = 1000000 * 96/4096 = 23438
#                       (cycle-matched: 1.91 updates of history; full env-frame
#                        match doesn't fit in 8 GB)
# =============================================================================

# ── Environment ──────────────────────────────────────────────────────────────
env_name: "Craftax-Classic-Symbolic-v1"
use_optimistic_resets: false
optimistic_reset_ratio: 16

# ── Transformer architecture ─────────────────────────────────────────────────
d_model: 384
n_heads: 8
n_layers: 6
d_ff: 768
obs_encoder_layers: 2
obs_encoder_width: 768
dropout_rate: 0.1

# ── Diffusion ────────────────────────────────────────────────────────────────
plan_horizon: 32
diffusion_schedule: "cosine"
train_sigma: 0.0
label_smoothing: 0.0

# ── Reverse sampling ─────────────────────────────────────────────────────────
diffusion_steps: 15
diffusion_steps_eval: 10
remask_strategy: "rescale"
eta: 0.5
use_loop: true
t_on: 0.7
t_off: 0.3
temperature: 0.5
top_p: 0.95

# ── Optimisation ─────────────────────────────────────────────────────────────
lr: 3.0e-4
max_grad_norm: 1.0
lr_warmup_steps: 8533               # = 200 * 128/3  (UCL warmup * ucl_fpu/qmul_fpu)

# ── Rollout ──────────────────────────────────────────────────────────────────
num_envs: 96                        # VRAM-tuned to ~6.5–7.5 GB; minibatch = 96*128/8 = 1536
num_steps: 128
num_minibatches: 8
update_epochs: 8
num_repeats: 1

# ── Offline training ─────────────────────────────────────────────────────────
offline_total_timesteps: 3e8  # IDENTICAL to UCL; = 3e8/12288 ~= 24414 QMUL updates
collect_temperature: 1.0
return_weight_cap: 5.0

# ── Online DAgger training ───────────────────────────────────────────────────
online_total_timesteps: 8e8   # IDENTICAL to UCL; = 8e8/12288 ~= 65104 QMUL updates
dagger_beta_init: 1.0
dagger_beta_decay: 0.99998359  # = 0.9993^(3/128); final beta matches UCL's 0.9993^1526 ~= 0.344
dagger_buffer_max: 23438       # = 1000000 * 96/4096

# ── Validation rollouts ──────────────────────────────────────────────────────
val_interval: 171                   # = 4 * 128/3  (UCL val_interval * ucl_fpu/qmul_fpu)
val_diffusion_steps: 50
val_replan_every: 4
val_steps: 256

# ── Data collection ──────────────────────────────────────────────────────────
collect_num_steps: 10000000
collect_num_envs: 128
ppo_model_type: "ppo_rnn"
layer_size: 512

# ── Inference ────────────────────────────────────────────────────────────────
eval_steps: 10000
eval_num_envs: 32

# ── Checkpointing ────────────────────────────────────────────────────────────
save_policy: true

# ── Resume ───────────────────────────────────────────────────────────────────
resume_checkpoint_path: null
resume_wandb_run_id: null
resume_step: null

# ── Logging ──────────────────────────────────────────────────────────────────
seed: 43
use_wandb: true
wandb_project: "remdm-craftax"
wandb_entity: "mathis-weil-university-college-london-ucl-"
