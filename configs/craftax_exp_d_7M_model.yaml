# =============================================================================
# Final Full Craftax DAgger — RTX 4090 24 GB - EXP D - 6.8M model
# Big transformer + full sampling recipe + slow beta decay.  Produces the Full
# Craftax DAgger checkpoint used by the RL fine-tuning ablation suite.
# =============================================================================

# ── Environment ──────────────────────────────────────────────────────────────
env_name: "Craftax-Symbolic-v1"

# ── Reverse sampling ─────────────────────────────────────────────────────────
diffusion_steps: 25
temperature: 0.3

# ── Optimisation ─────────────────────────────────────────────────────────────
lr: 5.0e-4
lr_warmup_frames: 7.86432e7         # = 300 update steps at this hardware (300 * 2048 * 128)

# ── Rollout ──────────────────────────────────────────────────────────────────
num_envs: 832

# ── Offline training ─────────────────────────────────────────────────────────
offline_total_timesteps: 2.0e+8

# ── Online DAgger training ───────────────────────────────────────────────────
online_total_timesteps: 2.0e+8
dagger_beta_final: 0.385            # 0.9995^1907 at this hardware; auto-resolves per fpu
dagger_buffer_cycles: 0.76294       # ~200K samples on GPU-24GB = ~0.76 update cycles of history

# ── Validation rollouts ──────────────────────────────────────────────────────
val_diffusion_steps: 25
val_replan_every: 2

# ── Logging ──────────────────────────────────────────────────────────────────
seed: 42

# ── Baseline pins ────────────────────────────────────────────────────────────
# defaults.yaml holds the final Classic recipe, not a neutral baseline. This
# experiment predates that recipe and is defined against the original
# baseline, so it pins the values it used to inherit. They are load-bearing:
# removing them silently redefines this experiment.

d_model: 256
n_heads: 4
n_layers: 4
d_ff: 512
obs_encoder_width: 512
