# =============================================================================
# UCL 4090/3090 preset
# Target hardware: NVIDIA RTX 4090 / 3090
# CUDA toolkit: 13.2 (install via: uv sync --extra cuda)
# Override any value via CLI: python main.py --mode offline --lr 1e-4
# =============================================================================

# ── Environment ──────────────────────────────────────────────────────────────
env_name: "Craftax-Classic-Symbolic-v1"
use_optimistic_resets: false
optimistic_reset_ratio: 16

# ── Transformer architecture ─────────────────────────────────────────────────
d_model: 256
n_heads: 4
n_layers: 4
d_ff: 512
obs_encoder_layers: 2
obs_encoder_width: 512
dropout_rate: 0.1

# ── Diffusion ────────────────────────────────────────────────────────────────
plan_horizon: 32
diffusion_schedule: "cosine"        # cosine | linear
train_sigma: 0.0                    # remasking correction during training (0 = standard MDLM)
label_smoothing: 0.0                # cross-entropy label smoothing (0 = exact ELBO)

# ── Reverse sampling ─────────────────────────────────────────────────────────
diffusion_steps: 15                 # denoising steps T at inference
remask_strategy: "rescale"          # rescale | cap | conf
eta: 0.5                            # remasking strength
use_loop: true                      # three-phase loop (Algorithm 3)
t_on: 0.7                           # loop: remasking starts
t_off: 0.3                          # loop: remasking ends
temperature: 0.5                    # softmax temperature for sampling
top_p: 0.95                         # nucleus sampling threshold

# ── Optimisation ─────────────────────────────────────────────────────────────
lr: 3.0e-4
max_grad_norm: 1.0
batch_size: 1024

# ── Offline training (--mode offline) ────────────────────────────────────────
total_timesteps: 1.0e+8
num_envs: 1024                      # doubled from 1024 — 4090 has 2x VRAM vs 4070
num_steps: 64
num_minibatches: 8
update_epochs: 4
num_repeats: 1
collect_temperature: 1.0
lr_warmup_steps: 0                  # linear warm-up steps before cosine LR decay (0 = disabled)
return_weight_cap: 5.0              # clip ceiling for per-window return weights
val_interval: 100                   # validate more often for 5000 updates
val_diffusion_steps: 50
val_replan_every: 4                 # env steps executed per diffusion plan during validation
val_steps: 128                      # total env steps per validation rollout

# ── Online DAgger training (--mode online) ───────────────────────────────────
num_updates: 5000                   # ~4h per run on 4090 (run two sequentially overnight)
replan_every: 4
dagger_beta_init: 1.0
dagger_beta_decay: 0.995            # slower decay for 5x more updates (beta still > 0.01 at step 1000)
dagger_buffer_max: 400000           # 2x buffer -- more replay diversity for longer runs

# ── Data collection (--mode collect) ─────────────────────────────────────────
collect_num_steps: 10000000
collect_num_envs: 128
ppo_model_type: "ppo_rnn"           # ppo | ppo_rnn | ppo_rnd
layer_size: 512

# ── Inference (--mode inference) ─────────────────────────────────────────────
eval_steps: 10000
eval_num_envs: 32                   # parallel agents during evaluation (separate from training num_envs)
diffusion_steps_eval: 10

# ── Checkpointing ───────────────────────────────────────────────────────────
checkpoint_dir: "checkpoints_online"
checkpoint_interval: 250            # more frequent saves for overnight runs
max_checkpoints: 5
save_policy: true

# ── Logging ──────────────────────────────────────────────────────────────────
seed: null                          # random if not set
use_wandb: true
wandb_project: "remdm-craftax"
wandb_entity: "mathis-weil-university-college-london-ucl-"
