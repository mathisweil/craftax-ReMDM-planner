# =============================================================================
# Experiment C-Full — Full recipe on Full Craftax
# Target hardware: NVIDIA RTX 3090 Ti / 4090 (24 GB)
# Same as exp_c_full_recipe.yaml but on Craftax-Symbolic-v1 (obs_dim 8268, 43
# actions). num_envs and dagger_buffer_max are dropped to fit the larger obs.
# =============================================================================

# ── Environment ──────────────────────────────────────────────────────────────
env_name: "Craftax-Symbolic-v1"

# ── Reverse sampling ─────────────────────────────────────────────────────────
diffusion_steps: 25
temperature: 0.3

# ── Optimisation ─────────────────────────────────────────────────────────────
lr: 5.0e-4
lr_warmup_frames: 286720            # 5 updates x 64 grad steps = 320 (was lr_warmup_steps: 300)

# ── Rollout ──────────────────────────────────────────────────────────────────
num_envs: 448                      # halved from 4096: larger obs per env

# ── Online DAgger training ───────────────────────────────────────────────────
dagger_beta_final: 0.2950745524539679  # = 0.9993^1743 (1e8 budget at 448 envs)
dagger_buffer_cycles: 3.4877232142857144  # x 57,344 fpu = 200,000 samples (8268 obs -> ~6.6 GB)

# ── Validation rollouts ──────────────────────────────────────────────────────
val_diffusion_steps: 25             # match diffusion_steps
val_replan_every: 2

# ── Logging ──────────────────────────────────────────────────────────────────
seed: 42

# ── Baseline pins ────────────────────────────────────────────────────────────
# defaults.yaml holds the final Classic recipe, not a neutral baseline. This
# experiment predates that recipe and is defined against the original
# baseline, so it pins the values it used to inherit. They are load-bearing:
# removing them silently redefines this experiment.
