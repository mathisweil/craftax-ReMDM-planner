# =============================================================================
# Final Full Craftax DAgger — QMUL H200 8 GB partition (seed 43)
# Env-frame-matched second seed of final_craftax_full_ucl.yaml.
# -----------------------------------------------------------------------------
# Hardware ratio is fixed: qmul_fpu/ucl_fpu = (384*128)/(2048*128) = 3/16.
# Because this ratio is independent of the total env-frame budget, every
# fairness-critical key below is INVARIANT under offline_total_timesteps and
# online_total_timesteps changes — as long as UCL and QMUL share the same
# totals, fairness holds automatically.
#
# Scaling formulas for keys denominated in update steps (not env frames):
#   dagger_beta_decay : ucl_decay^(qmul_fpu/ucl_fpu)
#                     = 0.9995^(3/16)  = 0.99990623
#   lr_warmup_steps   : ucl_warmup * (ucl_fpu/qmul_fpu)
#                     = 300 * 16/3    = 1600
#   val_interval      : ucl_val_interval * (ucl_fpu/qmul_fpu)
#                     = 100 * 16/3    = 533
#   dagger_buffer_max : ucl_buffer * (qmul_envs/ucl_envs)
#                     = 200000 * 384/2048 = 37500
#                       (cycle-matched: 0.76 updates of history; full env-frame
#                        match doesn't fit in 8 GB)
# =============================================================================

# ── Environment ──────────────────────────────────────────────────────────────
env_name: "Craftax-Symbolic-v1"
use_optimistic_resets: false
optimistic_reset_ratio: 16

# ── Transformer architecture ─────────────────────────────────────────────────
d_model: 384
n_heads: 8
n_layers: 6
d_ff: 768
obs_encoder_layers: 2
obs_encoder_width: 768
dropout_rate: 0.1

# ── Diffusion ────────────────────────────────────────────────────────────────
plan_horizon: 32
diffusion_schedule: "cosine"
train_sigma: 0.0
label_smoothing: 0.0

# ── Reverse sampling ─────────────────────────────────────────────────────────
diffusion_steps: 25
diffusion_steps_eval: 10
remask_strategy: "rescale"
eta: 0.5
use_loop: true
t_on: 0.7
t_off: 0.3
temperature: 0.3
top_p: 0.95

# ── Optimisation ─────────────────────────────────────────────────────────────
lr: 5.0e-4
max_grad_norm: 1.0
lr_warmup_steps: 1600               # = 300 * 16/3  (UCL warmup * ucl_fpu/qmul_fpu)

# ── Rollout ──────────────────────────────────────────────────────────────────
num_envs: 384                       # max for 8 GB; minibatch = 384*128/8 = 6144
num_steps: 128
num_minibatches: 8
update_epochs: 8
num_repeats: 1

# ── Offline training ─────────────────────────────────────────────────────────
offline_total_timesteps: 5e8  # IDENTICAL to UCL; = 5e8/49152 ~= 10173 QMUL updates
collect_temperature: 1.0
return_weight_cap: 5.0

# ── Online DAgger training ───────────────────────────────────────────────────
online_total_timesteps: 5e8   # IDENTICAL to UCL; = 5e8/49152 ~= 10173 QMUL updates
dagger_beta_init: 1.0
dagger_beta_decay: 0.99990623  # = 0.9995^(3/16); final beta matches UCL's 0.9995^1907 ~= 0.385
dagger_buffer_max: 37500       # = 200000 * 384/2048

# ── Validation rollouts ──────────────────────────────────────────────────────
val_interval: 533                   # = 100 * 16/3  (UCL val_interval * ucl_fpu/qmul_fpu)
val_diffusion_steps: 25
val_replan_every: 2
val_steps: 256

# ── Data collection ──────────────────────────────────────────────────────────
collect_num_steps: 10000000
collect_num_envs: 128
ppo_model_type: "ppo_rnn"
layer_size: 512

# ── Inference ────────────────────────────────────────────────────────────────
eval_steps: 10000
eval_num_envs: 32

# ── Checkpointing ────────────────────────────────────────────────────────────
save_policy: true

# ── Resume ───────────────────────────────────────────────────────────────────
resume_checkpoint_path: null
resume_wandb_run_id: null
resume_step: null

# ── Logging ──────────────────────────────────────────────────────────────────
seed: 43
use_wandb: true
wandb_project: "remdm-craftax"
wandb_entity: "mathis-weil-university-college-london-ucl-"
