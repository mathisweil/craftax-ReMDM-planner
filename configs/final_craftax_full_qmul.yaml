# =============================================================================
# Full Craftax DAgger — QMUL H200 (8 GB VRAM budget) — second seed
# Maximum-fidelity match to final_craftax_full_ucl.yaml (Exp C-Full v2, seed 42).
# -----------------------------------------------------------------------------
# CHANGES vs final_craftax_full_ucl.yaml (only what 8 GB forces, plus seed):
#   num_envs:            2048 -> 384      (largest that fits; obs_dim=8268 is 6x Classic)
#   dagger_buffer_max:   200000 -> 37500  (cycle-matched: 0.76 updates of history,
#                                          identical to UCL's 200k / (2048*128) ratio)
#   seed:                42 -> 43         (independent seed)
#   checkpoint_dir:      separate
# EVERYTHING ELSE is bit-identical to UCL: num_minibatches=8, update_epochs=8,
# num_updates=2000, lr=5e-4, lr_warmup_steps=300, dagger_beta_decay=0.9995,
# all architecture, all diffusion, all eval. Same SGD structure (8*8=64 grad
# steps per update), same beta schedule, same buffer replay-cycle period.
# The only unavoidable deviation is the per-step minibatch (6144 vs UCL 32768,
# ~5.3x smaller) — this is purely a function of the VRAM ceiling.
# Estimated VRAM: ~6.9 GB
# =============================================================================

# ── Environment ──────────────────────────────────────────────────────────────
env_name: "Craftax-Symbolic-v1"
use_optimistic_resets: false
optimistic_reset_ratio: 16

# ── Transformer architecture (IDENTICAL to first seed) ──────────────────────
d_model: 384
n_heads: 8
n_layers: 6
d_ff: 768
obs_encoder_layers: 2
obs_encoder_width: 768
dropout_rate: 0.1

# ── Diffusion (IDENTICAL) ────────────────────────────────────────────────────
plan_horizon: 32
diffusion_schedule: "cosine"
train_sigma: 0.0
label_smoothing: 0.0

# ── Reverse sampling (IDENTICAL) ────────────────────────────────────────────
diffusion_steps: 25
remask_strategy: "rescale"
eta: 0.5
use_loop: true
t_on: 0.7
t_off: 0.3
temperature: 0.3
top_p: 0.95

# ── Optimisation (IDENTICAL) ────────────────────────────────────────────────
lr: 5.0e-4
max_grad_norm: 1.0
batch_size: 1024

# ── Offline training (CHANGED: num_envs + total_timesteps; both follow from VRAM) ─
total_timesteps: 1.87e+7            # CHANGED: 1e+8 -> 1.87e+7 to keep offline
                                    # num_updates IDENTICAL to UCL: 381 updates
                                    # (381 * 128 * 384 = 18.7M)
num_envs: 384                       # CHANGED: 2048 -> 384 (max for 8 GB)
num_steps: 128
num_minibatches: 8                  # IDENTICAL — minibatch = 384*128/8 = 6144
update_epochs: 8
num_repeats: 1
collect_temperature: 1.0
lr_warmup_steps: 300
return_weight_cap: 5.0
val_interval: 30                    # IDENTICAL to UCL
val_diffusion_steps: 25
val_replan_every: 2
val_steps: 256

# ── Online DAgger training (CHANGED: buffer only; beta + updates IDENTICAL) ─
num_updates: 2000                   # IDENTICAL to UCL
replan_every: 2
dagger_beta_init: 1.0
dagger_beta_decay: 0.9995           # IDENTICAL — schedule must match for fairness
dagger_buffer_max: 37500            # CHANGED: 200000 -> 37500 (cycle-matched)

# ── Data collection ─────────────────────────────────────────────────────────
collect_num_steps: 10000000
collect_num_envs: 128
ppo_model_type: "ppo_rnn"
layer_size: 512

# ── Inference ────────────────────────────────────────────────────────────────
eval_steps: 10000
eval_num_envs: 32
diffusion_steps_eval: 10

# ── Checkpointing ───────────────────────────────────────────────────────────
checkpoint_dir: "checkpoints_exp_c_full_v2_seed43_qmul"
save_policy: true

# ── Resume ───────────────────────────────────────────────────────────────────
resume_checkpoint_path: null
resume_wandb_run_id: null
resume_step: null

# ── Logging ──────────────────────────────────────────────────────────────────
seed: 43                            # CHANGED: 42 -> 43 (different seed)
use_wandb: true
wandb_project: "remdm-craftax"
wandb_entity: "mathis-weil-university-college-london-ucl-"
