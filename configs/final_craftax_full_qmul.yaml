# =============================================================================
# Full Craftax DAgger — QMUL H200 (8 GB VRAM budget) — second seed (1000 updates)
# Equivalent recipe to final_craftax_full_expc_v2.yaml (Exp C-Full v2),
# scaled to fit 8 GB. Designed to be combined with the first seed
# (24 GB run on 4090, seed=42, 2500 updates).
# -----------------------------------------------------------------------------
# CHANGES vs final_craftax_full_expc_v2.yaml (only what 8 GB forces, plus seed):
#   num_envs:            2048 -> 256       (obs_dim=8268 is 6x Classic)
#   dagger_buffer_max:   200000 -> 50000   (50k * 8268 * 4 = 1.65 GB)
#   num_updates:         2500 -> 1000      (user requested)
#   seed:                42 -> 43          (different seed for fairness)
#   checkpoint_dir:      separate
# Architecture, optimisation, diffusion, eval, beta schedule are IDENTICAL.
# Effective minibatch shrinks 8x (32768 -> 4096) — unavoidable; all other
# optimisation hyperparameters are kept untouched to preserve seed comparability.
# Estimated VRAM: ~5-6 GB
# =============================================================================

# ── Environment ──────────────────────────────────────────────────────────────
env_name: "Craftax-Symbolic-v1"
use_optimistic_resets: false
optimistic_reset_ratio: 16

# ── Transformer architecture (IDENTICAL to first seed) ──────────────────────
d_model: 384
n_heads: 8
n_layers: 6
d_ff: 768
obs_encoder_layers: 2
obs_encoder_width: 768
dropout_rate: 0.1

# ── Diffusion (IDENTICAL) ────────────────────────────────────────────────────
plan_horizon: 32
diffusion_schedule: "cosine"
train_sigma: 0.0
label_smoothing: 0.0

# ── Reverse sampling (IDENTICAL) ────────────────────────────────────────────
diffusion_steps: 25
remask_strategy: "rescale"
eta: 0.5
use_loop: true
t_on: 0.7
t_off: 0.3
temperature: 0.3
top_p: 0.95

# ── Optimisation (IDENTICAL) ────────────────────────────────────────────────
lr: 5.0e-4
max_grad_norm: 1.0
batch_size: 1024

# ── Offline training (CHANGED: num_envs only) ───────────────────────────────
total_timesteps: 1.0e+8
num_envs: 256                       # CHANGED: 2048 -> 256 (8 GB budget; obs 6x larger)
num_steps: 128
num_minibatches: 8                  # IDENTICAL — minibatch = 256*128/8 = 4096
update_epochs: 8
num_repeats: 1
collect_temperature: 1.0
lr_warmup_steps: 300
return_weight_cap: 5.0
val_interval: 30
val_diffusion_steps: 25
val_replan_every: 2
val_steps: 256

# ── Online DAgger training (CHANGED: num_updates, buffer; beta IDENTICAL) ───
num_updates: 1000                   # CHANGED: 2500 -> 1000 (user requested)
replan_every: 2
dagger_beta_init: 1.0
dagger_beta_decay: 0.9995           # IDENTICAL — schedule must match for fairness
dagger_buffer_max: 50000            # CHANGED: 200000 -> 50000 (1.65 GB)

# ── Data collection ─────────────────────────────────────────────────────────
collect_num_steps: 10000000
collect_num_envs: 128
ppo_model_type: "ppo_rnn"
layer_size: 512

# ── Inference ────────────────────────────────────────────────────────────────
eval_steps: 10000
eval_num_envs: 32
diffusion_steps_eval: 10

# ── Checkpointing ───────────────────────────────────────────────────────────
checkpoint_dir: "checkpoints_exp_c_full_v2_seed43_qmul"
save_policy: true

# ── Resume ───────────────────────────────────────────────────────────────────
resume_checkpoint_path: null
resume_wandb_run_id: null
resume_step: null

# ── Logging ──────────────────────────────────────────────────────────────────
seed: 43                            # CHANGED: 42 -> 43 (different seed)
use_wandb: true
wandb_project: "remdm-craftax"
wandb_entity: "mathis-weil-university-college-london-ucl-"
