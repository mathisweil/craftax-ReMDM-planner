# =============================================================================
# Final Full Craftax DAgger — H200 8 GB partition - EXP C - 15M model
# Env-frame-matched second seed of final_craftax_gpu_24gb.yaml.
# -----------------------------------------------------------------------------
# configs/defaults.yaml holds the Classic recipe. Full Craftax departs from it
# in eight places, listed below, and those eight are DUPLICATED verbatim in
# final_craftax_gpu_24gb.yaml: with no inheritance between configs there is nowhere
# else to put them. Only num_envs and seed genuinely differ between the two.
#
# So: a Full Craftax hyperparameter change must be made in BOTH files. The
# guard is test_cluster_siblings_differ_only_in_num_envs_and_seed, which fails
# if they drift.
#
# Budgets and warmup are the canonical 1e8-frame / 1,638,400-frame values
# inherited from defaults.yaml (author decision 2026-08-15, final).
# Fairness-critical hyperparameters are denominated in env frames or update
# cycles, so resolve_scaled_hyperparams() rescales them to this rollout width
# automatically. Resolves to num_updates = 12,207, lr_warmup_steps = 12,800
# gradient steps (200 updates x 64), dagger_buffer_max = 6,250, beta decay
# 0.9999218, 781,248 total gradient steps.
# =============================================================================

# ── Environment ──────────────────────────────────────────────────────────────
env_name: "Craftax-Symbolic-v1"

# ── Reverse sampling ─────────────────────────────────────────────────────────
diffusion_steps: 25
temperature: 0.3

# ── Optimisation ─────────────────────────────────────────────────────────────
lr: 5.0e-4

# ── Rollout ──────────────────────────────────────────────────────────────────
num_envs: 64

# ── Online DAgger training ───────────────────────────────────────────────────
dagger_beta_final: 0.385            # resolves to decay 0.9999218 over 12,207 updates
# Cycle-denominated by author decision (2026-08-15): retention stays
# hardware-invariant. 0.76294 cycles * 8192 fpu = 6,250 samples.
dagger_buffer_cycles: 0.76294       # -> dagger_buffer_max = 6,250 samples

# ── Validation rollouts ──────────────────────────────────────────────────────
val_diffusion_steps: 25
val_replan_every: 2

# ── Logging ──────────────────────────────────────────────────────────────────
seed: 43
