# =============================================================================
# Final Full Craftax DAgger — QMUL H200 8 GB partition - EXP C - 15M model
# Env-frame-matched second seed of final_craftax_ucl.yaml.
# -----------------------------------------------------------------------------
# This file is the shared base for the pair: `final_craftax_ucl.yaml` extends
# it and restates only num_envs (448 vs 64 here) and seed (42 vs 43 here), so
# the two clusters cannot drift apart on any other hyperparameter.
#
# It carries only its deltas against configs/defaults.yaml.  All
# fairness-critical hyperparameters are denominated in env frames or update
# cycles, so they are AUTOMATICALLY scaled to this hardware tier by
# resolve_scaled_hyperparams() — no manual derivation.
# =============================================================================

# ── Environment ──────────────────────────────────────────────────────────────
env_name: "Craftax-Symbolic-v1"

# ── Transformer architecture ─────────────────────────────────────────────────
d_model: 384
n_heads: 8
n_layers: 6
d_ff: 768
obs_encoder_width: 768

# ── Reverse sampling ─────────────────────────────────────────────────────────
diffusion_steps: 25
temperature: 0.3

# ── Optimisation ─────────────────────────────────────────────────────────────
lr: 5.0e-4
lr_warmup_frames: 7.86432e7         # IDENTICAL to UCL; resolves to 1600 update steps on 384 envs

# ── Rollout ──────────────────────────────────────────────────────────────────
num_envs: 64
num_steps: 128
update_epochs: 8

# ── Offline training ─────────────────────────────────────────────────────────
offline_total_timesteps: 2.0e+8        # IDENTICAL to UCL

# ── Online DAgger training ───────────────────────────────────────────────────
online_total_timesteps: 2.0e+8         # IDENTICAL to UCL
dagger_beta_final: 0.385            # IDENTICAL to UCL; resolves to 0.99990623 decay on 384 envs
dagger_buffer_cycles: 0.76294       # IDENTICAL to UCL; resolves to ~37500 samples on 384 envs

# ── Validation rollouts ──────────────────────────────────────────────────────
val_interval_frames: 1.0e+6
val_diffusion_steps: 25
val_replan_every: 2
val_steps: 256

# ── Logging ──────────────────────────────────────────────────────────────────
seed: 43
