# =============================================================================
# Final Full Craftax DAgger — QMUL H200 8 GB partition - EXP C - 15M model
# Env-frame-matched second seed of final_craftax_ucl.yaml.
# -----------------------------------------------------------------------------
# configs/defaults.yaml holds the Classic recipe. Full Craftax departs from it
# in eleven places, listed below, and those eleven are DUPLICATED verbatim in
# final_craftax_ucl.yaml: with no inheritance between configs there is nowhere
# else to put them. Only num_envs and seed genuinely differ between the two.
#
# So: a Full Craftax hyperparameter change must be made in BOTH files. The
# guard is test_craftax_siblings_differ_only_in_num_envs_and_seed, which fails
# if they drift.
#
# Fairness-critical hyperparameters are denominated in env frames or update
# cycles, so resolve_scaled_hyperparams() rescales them to this rollout width
# automatically. Resolves to num_updates = 36,621, lr_warmup_steps = 9600,
# dagger_buffer_max = 6,250, beta decay 0.9999739.
#
# Units caveat: lr_warmup_steps is handed to optax as a *gradient*-step count,
# while decay_steps is num_updates * update_epochs * num_minibatches. Read as
# update steps a warmup can look as though it outlasts the run when it does
# not. Open for the author; see PERF_DAGGER_RESULTS_CRAFTAX.md.
# =============================================================================

# ── Environment ──────────────────────────────────────────────────────────────
env_name: "Craftax-Symbolic-v1"

# ── Reverse sampling ─────────────────────────────────────────────────────────
diffusion_steps: 25
temperature: 0.3

# ── Optimisation ─────────────────────────────────────────────────────────────
lr: 5.0e-4
# IDENTICAL to UCL as a frame budget.  On this file's 64 envs it resolves to
# lr_warmup_steps = 9600 against 2,343,744 gradient steps.
lr_warmup_frames: 7.86432e7         # -> lr_warmup_steps = 9600

# ── Rollout ──────────────────────────────────────────────────────────────────
num_envs: 64

# ── Offline training ─────────────────────────────────────────────────────────
offline_total_timesteps: 3.0e+8        # IDENTICAL to UCL

# ── Online DAgger training ───────────────────────────────────────────────────
online_total_timesteps: 3.0e+8         # IDENTICAL to UCL
dagger_beta_final: 0.385            # resolves to decay 0.9999739 over 36,621 updates
# 0.76294 cycles * 8192 fpu = 6,250 samples, not the ~37,500 an earlier
# num_envs: 384 gave.  Whether the recipe wants a fixed sample count or a
# fixed cycle count is an open question for the author.
dagger_buffer_cycles: 0.76294       # -> dagger_buffer_max = 6,250 samples

# ── Validation rollouts ──────────────────────────────────────────────────────
val_diffusion_steps: 25
val_replan_every: 2

# ── Logging ──────────────────────────────────────────────────────────────────
seed: 43
