# =============================================================================
# Experiment C — Full recipe (beta + big model + training dynamics)
# Target hardware: NVIDIA RTX 4090 (24 GB)
# Cumulative with Experiments A + B: also bumps diffusion_steps, lowers
# temperature, raises lr, and tightens validation to match training settings.
# =============================================================================

# ── Reverse sampling ─────────────────────────────────────────────────────────
diffusion_steps: 25                 # more denoising for cleaner plans
temperature: 0.3                    # sharper sampling than baseline

# ── Optimisation ─────────────────────────────────────────────────────────────
lr: 5.0e-4                          # scale with 2x effective batch
lr_warmup_steps: 300                # stabilize higher LR + bigger model

# ── Rollout ──────────────────────────────────────────────────────────────────
num_envs: 448

# ── Online DAgger training ───────────────────────────────────────────────────
dagger_beta_decay: 0.9993
dagger_buffer_max: 1000000

# ── Validation rollouts ──────────────────────────────────────────────────────
val_interval: 30
val_diffusion_steps: 25             # match diffusion_steps
val_replan_every: 2

# ── Logging ──────────────────────────────────────────────────────────────────
seed: 42

# ── Baseline pins ────────────────────────────────────────────────────────────
# defaults.yaml holds the final Classic recipe, not a neutral baseline. This
# experiment predates that recipe and is defined against the original
# baseline, so it pins the values it used to inherit. They are load-bearing:
# removing them silently redefines this experiment.

# These PRIMARY env-frame keys override their LEGACY counterparts whenever
# they are non-null. Held at null so this file's own settings stay
# authoritative: lr_warmup_steps=300, dagger_beta_decay=0.9993,
# dagger_buffer_max=1000000, val_interval=30
lr_warmup_frames: null
dagger_beta_final: null
dagger_buffer_cycles: null
val_interval_frames: null
