# =============================================================================
# Final Craftax Classic DAgger — UCL RTX 3090 Ti 24 GB - EXP D - 3.2M model
# Big transformer + slow beta decay. Produces the Classic DAgger checkpoint
# used by the RL fine-tuning ablation suite.
# =============================================================================

# ── Rollout ──────────────────────────────────────────────────────────────────
num_envs: 1120

# ── Offline training ─────────────────────────────────────────────────────────
offline_total_timesteps: 2.0e+8

# ── Online DAgger training ───────────────────────────────────────────────────
online_total_timesteps: 2.0e+8

# ── Logging ──────────────────────────────────────────────────────────────────
seed: 42

# ── Baseline pins ────────────────────────────────────────────────────────────
# defaults.yaml holds the final Classic recipe, not a neutral baseline. This
# experiment predates that recipe and is defined against the original
# baseline, so it pins the values it used to inherit. They are load-bearing:
# removing them silently redefines this experiment.

d_model: 256
n_heads: 4
n_layers: 4
d_ff: 512
obs_encoder_width: 512
