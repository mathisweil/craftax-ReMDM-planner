# =============================================================================
# RTX 3060 "Big Diffusion" Hyper-Reactive Config (~100k Steps)
# =============================================================================

# ── Environment & Simulation (3060 Safe Limits) ────────────────────────────
env_name: "Craftax-Classic-Symbolic-v1"
num_envs: 32               # Drastically lowered so your 3060 doesn't OOM
num_steps: 128             
num_updates: 25            # 25 updates * 4096 frames = 102,400 Global Steps
replan_every: 1            # HYPER-REACTIVE: Re-rolls every single frame
update_epochs: 4
num_minibatches: 16        # Slices the 4,096 frames into tiny batches for VRAM safety

# ── The Brain Setup (Teacher Included) ──────────────────────────────────────
offline_checkpoint_path: null                                 # Fresh Brain
ppo_checkpoint_path: "/home/ak/open-ended/Craftax/craftax-ReMDM-planner/checkpoints/policies"
ppo_model_type: "ppo_rnn"        # Explicitly telling it to use the RNN teacher
ppo_init_prob: 0.5               # Start with 50% Teacher guidance since the run is so short
ppo_decay_rate: 0.95             # Faster decay to let the student take over quickly

# ── Big Diffusion Architecture ──────────────────────────────────────────────
plan_horizon: 64           # IMAGINATION DOUBLED
diffusion_steps: 15
diffusion_schedule: "cosine"
remask_strategy: "rescale"
train_sigma: 0.0
eta: 0.5
t_on: 0.7
t_off: 0.3
top_p: 0.95                
use_loop: true

# The "Big" Model setup
d_model: 256
n_heads: 4
n_layers: 6                # Bumped up to 6 layers for a deeper network
d_ff: 512
obs_encoder_layers: 2
obs_encoder_width: 512
dropout_rate: 0.1

# ── GRPO & Optimisation ─────────────────────────────────────────────────────
grpo_group_size: 4         # Lowered from 8 to 4 to save VRAM during multiverse simulation
lr: 3.0e-4
max_grad_norm: 1.0
batch_size: 256

# ── System & Logging ────────────────────────────────────────────────────────
use_wandb: true
wandb_project: "craftax-remdm-3060-tests"
checkpoint_interval: 10
max_checkpoints: 1
checkpoint_dir: "checkpoints_3060_hyper"
save_policy: true        # Save the model checkpoint at the end of training
num_repeats: 1            # Number of independent training runs (vmapped)