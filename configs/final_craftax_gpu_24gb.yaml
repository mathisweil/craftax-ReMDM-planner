# =============================================================================
# Final Full Craftax DAgger — RTX 4090 24 GB - EXP C - 15M model
# Big transformer + full sampling recipe + slow beta decay.  Produces the Full
# Craftax DAgger checkpoint used by the RL fine-tuning ablation suite.
# -----------------------------------------------------------------------------
# configs/defaults.yaml holds the Classic recipe. Full Craftax departs from it
# in eight places, listed below, and those eight are DUPLICATED verbatim in
# final_craftax_gpu_h200.yaml: with no inheritance between configs there is nowhere
# else to put them. Only num_envs and seed genuinely differ between the two.
#
# So: a Full Craftax hyperparameter change must be made in BOTH files. The
# guard is test_cluster_siblings_differ_only_in_num_envs_and_seed, which fails
# if they drift.
#
# Budgets and warmup are the canonical 1e8-frame / 1,638,400-frame values
# inherited from defaults.yaml (author decision 2026-08-15, final).
# Fairness-critical hyperparameters are denominated in env frames or update
# cycles, so resolve_scaled_hyperparams() rescales them to this rollout width
# automatically. Resolves to num_updates = 1743, lr_warmup_steps = 1792
# gradient steps (28 updates x 64), dagger_buffer_max = 43,750, beta decay
# 0.9994525, 111,552 total gradient steps.
# =============================================================================

# ── Environment ──────────────────────────────────────────────────────────────
env_name: "Craftax-Symbolic-v1"

# ── Reverse sampling ─────────────────────────────────────────────────────────
diffusion_steps: 25
temperature: 0.3

# ── Optimisation ─────────────────────────────────────────────────────────────
lr: 5.0e-4

# ── Rollout ──────────────────────────────────────────────────────────────────
num_envs: 448

# ── Online DAgger training ───────────────────────────────────────────────────
dagger_beta_final: 0.385            # resolves to decay 0.9994525 over 1743 updates
# Cycle-denominated by author decision (2026-08-15): retention stays
# hardware-invariant. 0.76294 cycles * 57,344 fpu = 43,750 samples.
dagger_buffer_cycles: 0.76294       # -> dagger_buffer_max = 43,750 samples

# ── Validation rollouts ──────────────────────────────────────────────────────
val_diffusion_steps: 25
val_replan_every: 2

# ── Logging ──────────────────────────────────────────────────────────────────
seed: 42
