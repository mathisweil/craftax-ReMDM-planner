# =============================================================================
# Experiment A — Beta decay fix only (isolate data quality)
# Target hardware: NVIDIA RTX 3090 Ti (24 GB)
# Slows dagger_beta_decay so the expert stays present roughly 2x longer.
# Everything else identical to the baseline.
# =============================================================================

# ── Optimisation ─────────────────────────────────────────────────────────────
lr_warmup_steps: 200

# ── Rollout ──────────────────────────────────────────────────────────────────
num_envs: 4096
num_minibatches: 16

# ── Online DAgger training ───────────────────────────────────────────────────
online_num_updates: 1500            # val plateaus by step 800
dagger_beta_decay: 0.9993           # beta > 0.5 at step 990, > 0.1 at step 3290
dagger_buffer_max: 1000000

# ── Validation rollouts ──────────────────────────────────────────────────────
val_interval: 30

# ── Logging ──────────────────────────────────────────────────────────────────
seed: 42

# ── Baseline pins ────────────────────────────────────────────────────────────
# defaults.yaml holds the final Classic recipe, not a neutral baseline. This
# experiment predates that recipe and is defined against the original
# baseline, so it pins the values it used to inherit. They are load-bearing:
# removing them silently redefines this experiment.

d_model: 256
n_heads: 4
n_layers: 4
d_ff: 512
obs_encoder_width: 512

# These PRIMARY env-frame keys override their LEGACY counterparts whenever
# they are non-null. Held at null so this file's own settings stay
# authoritative: lr_warmup_steps=200, online_num_updates=1500,
# dagger_beta_decay=0.9993, dagger_buffer_max=1000000, val_interval=30
lr_warmup_frames: null
online_total_timesteps: null
dagger_beta_final: null
dagger_buffer_cycles: null
val_interval_frames: null
