# =============================================================================
# Experiment B-Full — Beta fix + big model on Full Craftax
# Target hardware: NVIDIA RTX 3090 Ti (24 GB)
# Same as exp_b_beta_big_model.yaml but on Craftax-Symbolic-v1 (obs_dim 8268,
# 43 actions). num_envs and dagger_buffer_max are dropped to fit the larger obs.
# =============================================================================

# ── Environment ──────────────────────────────────────────────────────────────
env_name: "Craftax-Symbolic-v1"

# ── Optimisation ─────────────────────────────────────────────────────────────
lr_warmup_steps: 200

# ── Rollout ──────────────────────────────────────────────────────────────────
num_envs: 2048                      # halved from 4096: larger obs per env

# ── Online DAgger training ───────────────────────────────────────────────────
online_num_updates: 2000            # harder task, more room to learn
dagger_beta_decay: 0.9993
dagger_buffer_max: 200000           # 8268 obs -> ~6.6 GB at 200k

# ── Validation rollouts ──────────────────────────────────────────────────────
val_interval: 30

# ── Logging ──────────────────────────────────────────────────────────────────
seed: 42

# ── Baseline pins ────────────────────────────────────────────────────────────
# defaults.yaml holds the final Classic recipe, not a neutral baseline. This
# experiment predates that recipe and is defined against the original
# baseline, so it pins the values it used to inherit. They are load-bearing:
# removing them silently redefines this experiment.

# These PRIMARY env-frame keys override their LEGACY counterparts whenever
# they are non-null. Held at null so this file's own settings stay
# authoritative: lr_warmup_steps=200, online_num_updates=2000,
# dagger_beta_decay=0.9993, dagger_buffer_max=200000, val_interval=30
lr_warmup_frames: null
online_total_timesteps: null
dagger_beta_final: null
dagger_buffer_cycles: null
val_interval_frames: null
