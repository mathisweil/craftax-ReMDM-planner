# =============================================================================
# Final Craftax Classic DAgger — UCL RTX 3090 Ti 24 GB - EXP B - 9M model
# Big transformer + slow beta decay. Produces the Classic DAgger checkpoint
# used by the RL fine-tuning ablation suite.
# -----------------------------------------------------------------------------
# The recipe itself lives in configs/defaults.yaml. Only what differs between
# the two clusters lives here, which is the rollout width and the seed.
#
# Nothing enforces that this file and final_classic_qmul.yaml stay in step: the
# guard is test_cluster_siblings_differ_only_in_num_envs_and_seed. A
# hyperparameter change meant for both belongs in defaults.yaml, not here.
#
# All fairness-critical hyperparameters are denominated in env frames or update
# cycles, so resolve_scaled_hyperparams() rescales them to this rollout width
# automatically. Resolves to num_updates = 1525, lr_warmup_steps = 1600,
# dagger_buffer_max = 125,000, beta decay 0.9993005.
# =============================================================================

# ── Rollout ──────────────────────────────────────────────────────────────────
num_envs: 512

# ── Logging ──────────────────────────────────────────────────────────────────
seed: 42
