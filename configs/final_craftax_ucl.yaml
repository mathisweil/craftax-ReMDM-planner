# =============================================================================
# Final Full Craftax DAgger — UCL RTX 4090 24 GB - EXP C - 15M model
# Big transformer + full sampling recipe + slow beta decay.  Produces the Full
# Craftax DAgger checkpoint used by the RL fine-tuning ablation suite.
# =============================================================================

# ── Environment ──────────────────────────────────────────────────────────────
env_name: "Craftax-Symbolic-v1"
use_optimistic_resets: false
optimistic_reset_ratio: 16

# ── Transformer architecture ─────────────────────────────────────────────────
d_model: 384
n_heads: 8
n_layers: 6
d_ff: 768
obs_encoder_layers: 2
obs_encoder_width: 768
dropout_rate: 0.1

# ── Diffusion ────────────────────────────────────────────────────────────────
plan_horizon: 32
diffusion_schedule: "cosine"
train_sigma: 0.0
label_smoothing: 0.0

# ── Reverse sampling ─────────────────────────────────────────────────────────
diffusion_steps: 25
diffusion_steps_eval: 10
remask_strategy: "rescale"
eta: 0.5
use_loop: true
t_on: 0.7
t_off: 0.3
temperature: 0.3
top_p: 0.95

# ── Optimisation ─────────────────────────────────────────────────────────────
lr: 5.0e-4
max_grad_norm: 1.0
# 7.86432e7 frames / (448 * 128) = 1371.  Note lr_warmup_steps is handed to
# optax as a *gradient*-step count while decay_steps is num_updates *
# update_epochs * num_minibatches, so the warmup actually ends at gradient
# step 1371, i.e. update 21 of 3487 (~1.2M frames, not 78.6M).  See
# PERF_DAGGER_RESULTS_CRAFTAX.md; the units question is open for the author.
lr_warmup_frames: 7.86432e7         # -> lr_warmup_steps = 1371

# ── Rollout ──────────────────────────────────────────────────────────────────
num_envs: 448
num_steps: 128
num_minibatches: 8
update_epochs: 8
num_repeats: 1

# ── Offline training ─────────────────────────────────────────────────────────
offline_total_timesteps: 2.0e+8
collect_temperature: 1.0
return_weight_cap: 5.0

# ── Online DAgger training ───────────────────────────────────────────────────
online_total_timesteps: 2.0e+8
dagger_beta_init: 1.0
dagger_beta_final: 0.385            # resolves to decay 0.9997263 over 3487 updates
# 0.76294 cycles * 57344 fpu = 43,750 samples, not the ~200K an earlier
# num_envs: 2048 gave.  Whether the recipe wants a fixed sample count or a
# fixed cycle count is an open question for the author.
dagger_buffer_cycles: 0.76294       # -> dagger_buffer_max = 43,750 samples

# ── Validation rollouts ──────────────────────────────────────────────────────
val_interval_frames: 1.0e+6
val_diffusion_steps: 25
val_replan_every: 2
val_steps: 256

# ── Data collection ──────────────────────────────────────────────────────────
collect_num_steps: 10000000
collect_num_envs: 128
ppo_model_type: "ppo_rnn"
layer_size: 512

# ── Inference ────────────────────────────────────────────────────────────────
eval_steps: 10000
eval_num_envs: 32

# ── Checkpointing ────────────────────────────────────────────────────────────
save_policy: true

# ── Logging ──────────────────────────────────────────────────────────────────
seed: 42
use_wandb: true
wandb_project: craftax-ReMDM-planner
wandb_entity: myopic-planner
