# =============================================================================
# Final Full Craftax DAgger — UCL RTX 4090 24 GB - EXP C - 15M model
# Big transformer + full sampling recipe + slow beta decay.  Produces the Full
# Craftax DAgger checkpoint used by the RL fine-tuning ablation suite.
# -----------------------------------------------------------------------------
# Inherits from `final_craftax_qmul.yaml`, which itself layers onto
# configs/defaults.yaml.  Only the genuine UCL deltas live here.
#
# The two clusters run the same recipe at different rollout widths, so the
# "identical hyperparameters across clusters" invariant is now enforced by
# inheritance rather than by keeping two files in step by hand.  Every
# fairness-critical hyperparameter is denominated in env frames or update
# cycles and is scaled to this hardware tier by resolve_scaled_hyperparams().
#
# Inherited values resolve differently here, because num_envs sets the frames
# per update (448 * 128 = 57,344) that every env-frame budget divides by:
#   lr_warmup_frames: 7.86432e7   -> lr_warmup_steps = 1371
#   dagger_beta_final: 0.385      -> decay 0.9998175 over 5231 updates
#   dagger_buffer_cycles: 0.76294 -> dagger_buffer_max = 43,750 samples
#
# The buffer is 43,750 samples, not the ~200K an earlier num_envs: 2048 gave.
# Whether the recipe wants a fixed sample count or a fixed cycle count is an
# open question for the author.  See the QMUL base for the lr_warmup_steps
# units caveat, which applies to both files.
#
# These come from resolve_num_updates and resolve_scaled_hyperparams, not from
# arithmetic done by hand, and are asserted by
# test_final_configs_resolve_to_their_documented_quantities.
# =============================================================================
extends: final_craftax_qmul.yaml

# ── Rollout ──────────────────────────────────────────────────────────────────
num_envs: 448

# ── Logging ──────────────────────────────────────────────────────────────────
seed: 42
