# =============================================================================
# Final Full Craftax DAgger — UCL RTX 4090 24 GB - EXP C - 15M model
# Big transformer + full sampling recipe + slow beta decay.  Produces the Full
# Craftax DAgger checkpoint used by the RL fine-tuning ablation suite.
# -----------------------------------------------------------------------------
# Inherits from `final_craftax_qmul.yaml`, which itself layers onto
# configs/defaults.yaml.  Only the genuine UCL deltas live here.
#
# The two clusters run the same recipe at different rollout widths, so the
# "identical hyperparameters across clusters" invariant is now enforced by
# inheritance rather than by keeping two files in step by hand.  Every
# fairness-critical hyperparameter is denominated in env frames or update
# cycles and is scaled to this hardware tier by resolve_scaled_hyperparams().
#
# Inherited values whose UCL reading differs from the QMUL one:
#   lr_warmup_frames: 7.86432e7   = 300 update steps at this hardware
#                                   (300 * 2048 * 128)
#   dagger_beta_final: 0.385      0.9995^1907 at this hardware; auto-resolves
#                                   per fpu
#   dagger_buffer_cycles: 0.76294 ~200K samples on UCL = ~0.76 update cycles
#                                   of history
# =============================================================================
extends: final_craftax_qmul.yaml

# ── Rollout ──────────────────────────────────────────────────────────────────
num_envs: 448

# ── Logging ──────────────────────────────────────────────────────────────────
seed: 42
