# =============================================================================
# Experiment B — Beta fix + bigger model (isolate model capacity)
# Target hardware: NVIDIA RTX 3090 Ti (24 GB)
# Cumulative with Experiment A: same beta decay fix, plus a 3.5x larger
# transformer (~18 GB peak VRAM).
# =============================================================================

# ── Optimisation ─────────────────────────────────────────────────────────────
lr_warmup_frames: 1572864           # 3 updates x 64 grad steps = 192 (was lr_warmup_steps: 200)

# ── Rollout ──────────────────────────────────────────────────────────────────
num_envs: 4096

# ── Online DAgger training ───────────────────────────────────────────────────
online_total_timesteps: 786432000   # 1500 updates x 524,288 fpu
dagger_beta_final: 0.3498091105923036  # = 0.9993^1500
dagger_buffer_cycles: 1.9073486328125  # x 524,288 fpu = 1,000,000 samples

# ── Validation rollouts ──────────────────────────────────────────────────────
val_interval_frames: 15728640       # 30 updates x 524,288 fpu

# ── Logging ──────────────────────────────────────────────────────────────────
seed: 42

# ── Baseline pins ────────────────────────────────────────────────────────────
# defaults.yaml holds the final Classic recipe, not a neutral baseline. This
# experiment predates that recipe and is defined against the original
# baseline, so it pins the values it used to inherit. They are load-bearing:
# removing them silently redefines this experiment.
