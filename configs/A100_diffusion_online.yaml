# =============================================================================
# RTX 3060 "Big Diffusion" Hyper-Reactive Config (~100k Steps)
# =============================================================================

# ── Environment & Simulation (3060 Safe Limits) ────────────────────────────
env_name: "Craftax-Classic-Symbolic-v1"
num_envs: 512              # 512 envs * 128 steps = 65,536 frames per loop
num_steps: 128             
num_updates: 8             # 8 loops = ~524,000 global steps
replan_every: 1            # HYPER-REACTIVE
update_epochs: 2           # Lowered to 2 to guarantee it finishes in 10 mins
num_minibatches: 64

# ── The Brain Setup (Teacher Included) ──────────────────────────────────────
offline_checkpoint_path: null                                 # Fresh Brain
ppo_checkpoint_path: "/home/ak/open-ended/Craftax/craftax-ReMDM-planner/checkpoints/policies"
ppo_model_type: "ppo_rnn"
ppo_init_prob: 0.5         # 50% Teacher guidance
ppo_decay_rate: 0.90       # Fast decay

# ── Big Diffusion Architecture (Must match Offline) ─────────────────────────
plan_horizon: 64           
diffusion_steps: 15
diffusion_schedule: "cosine"
remask_strategy: "rescale"
train_sigma: 0.0
eta: 0.5
t_on: 0.7
t_off: 0.3
top_p: 0.95                
use_loop: true

d_model: 256
n_heads: 4
n_layers: 6                
d_ff: 512
obs_encoder_layers: 2
obs_encoder_width: 512
dropout_rate: 0.1

# ── GRPO & Optimisation ─────────────────────────────────────────────────────
grpo_group_size: 8
lr: 3.0e-4
max_grad_norm: 1.0
batch_size: 256

# ── System & Logging ────────────────────────────────────────────────────────
use_wandb: true
wandb_project: "craftax-remdm-3060-tests"
wandb_entity: "mathis-weil-university-college-london-ucl-"
checkpoint_interval: 10
max_checkpoints: 1
checkpoint_dir: "checkpoints_3060_hyper"
save_policy: true        # Save the model checkpoint at the end of training
num_repeats: 1            # Number of independent training runs (vmapped)